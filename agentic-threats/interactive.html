, "end": 31.238, "text": "Intruders still use stolen credentials, and they still go after unpatched systems."}, {"start": 31.688, "end": 33.617, "text": "What has changed is speed and scale."}, {"start": 34.067, "end": 40.125, "text": "Google describes intrusions running at machine speed, with complex attack paths chained together automatically."}, {"start": 40.975, "end": 42.718, "text": "Think of it as a ladder of autonomy."}, {"start": 43.168, "end": 46.768, "text": "At the bottom, an attacker types prompts and copies out the answers."}, {"start": 47.218, "end": 54.083, "text": "Next, AI helps run partly automated scanning and exploitation, which is roughly where Google's previous report left things."}, {"start": 54.533, "end": 59.245, "text": "Now it reports agentic penetration testing frameworks being used during live intrusions."}, {"start": 59.695, "end": 64.496, "text": "And in one case, it found discovery and exploitation running with no human in the loop at all."}, {"start": 65.346, "end": 67.642, "text": "So what is a multi-agent offensive framework?"}, {"start": 68.092, "end": 71.161, "text": "Take CAIRN, one of the open source tools named in the report."}, {"start": 71.611, "end": 74.853, "text": "It runs a loop called observe, orient, decide, act."}, {"start": 75.303, "end": 77.901, "text": "Specialised agents share a common blackboard."}, {"start": 78.351, "end": 83.952, "text": "One agent might map the target, another look for weaknesses, another write a payload, and another run it."}, {"start": 84.402, "end": 91.179, "text": "Results go back on the blackboard, and the loop goes round again, from a starting point like a single IP address toward an objective."}, {"start": 92.029, "end": 95.835, "text": "According to the report, these frameworks share three core abilities."}, {"start": 96.285, "end": 99.408, "text": "They find and exploit low complexity vulnerabilities."}, {"start": 99.858, "end": 103.215, "text": "They use language models to write single use payloads on demand."}, {"start": 103.665, "end": 107.705, "text": "And they use real time feedback from each attempt to change tactics as they go."}, {"start": 108.555, "end": 114.428, "text": "Alongside the widely publicised ARTEX framework, Google has seen CAIRN and PentAGI deployed in the wild."}, {"start": 114.878, "end": 119.236, "text": "CAIRN was used in intrusions against targets including the US aerospace sector."}, {"start": 119.686, "end": 127.184, "text": "A platform built on PentAGI was used to scan a wide range of organisations in Asia, between late August and early October."}, {"start": 127.634, "end": 136.015, "text": "Google also saw experiments with CyberStrikeAI and HexStrike AI, which each connect language models to more than a hundred security tools."}, {"start": 136.465, "end": 141.199, "text": "And one China linked group appeared to be building its own framework, likely for espionage."}, {"start": 142.049, "end": 143.616, "text": "There is a catch for the attackers."}, {"start": 144.066, "end": 147.525, "text": "The report says these tools currently trade stealth for velocity."}, {"start": 147.975, "end": 153.609, "text": "They create a lot of traffic, use recognisable identifiers, and leave code level traces behind."}, {"start": 154.059, "end": 155.542, "text": "That makes them easier to detect."}, {"start": 155.992, "end": 160.258, "text": "But they still get the job done, and Google expects future versions to be quieter."}, {"start": 161.108, "end": 164.238, "text": "The second big trend is automated vulnerability research."}, {"start": 164.688, "end": 170.441, "text": "When a vendor ships a security patch, the difference between the old code and the new code points straight at the flaw."}, {"start": 170.891, "end": 172.924, "text": "Comparing the two is called patch diffing."}, {"start": 173.374, "end": 179.431, "text": "Now pipelines of agents can compare versions, spot the weakness, draft an exploit, and try it."}, {"start": 179.881, "end": 185.018, "text": "Flaws that are patched but not yet fixed everywhere are called n-days, and they are the easier target."}, {"start": 185.868, "end": 189.317, "text": "Google found one of these pipelines on an exposed staging server."}, {"start": 189.767, "end": 194.386, "text": "Called exploit_agent, it connected to several frontier and local language models."}, {"start": 194.836, "end": 203.056, "text": "It continuously compared popular web applications before and after patches, drafted exploits, and ran them, without a human stepping in."}, {"start": 203.506, "end": 208.094, "text": "A Russian comment in its configuration file called it a pilot for auto exploitation."}, {"start": 208.544, "end": 213.065, "text": "Victim data pointed to French media, entertainment and education websites."}, {"start": 213.915, "end": 215.32, "text": "The numbers point the same way."}, {"start": 215.77, "end": 222.674, "text": "Google found that overall vulnerability disclosures and exploits nearly doubled between January and August 2026."}, {"start": 223.124, "end": 232.758, "text": "Zero day exploits, which hit flaws before any patch exists, rose more slowly, from an average of eight a month in 2025 to eleven a month in 2026."}, {"start": 233.208, "end": 235.121, "text": "Then in August, they jumped to twenty two."}, {"start": 235.971, "end": 238.555, "text": "A real case shows how short the window has become."}, {"start": 239.005, "end": 245.32, "text": "In late August, two chained flaws in PaperCut print management servers let attackers run code without logging in."}, {"start": 245.77, "end": 250.871, "text": "Within a day of disclosure, researchers had used language models to produce working exploits."}, {"start": 251.321, "end": 262.74, "text": "Four days after disclosure, the security firm GreyNoise reported a campaign in which an attacker likely used language models to build exploits, assemble a target list, and hit hundreds of organisations."}, {"start": 263.19, "end": 268.116, "text": "GreyNoise noted the attacker went from a first foothold to domain administrator within minutes."}, {"start": 268.966, "end": 271.058, "text": "There is a flip side, which is noise."}, {"start": 271.508, "end": 280.395, "text": "Around two PHP flaws patched in October, hundreds of proof of concept exploits appeared that claimed to work but did not, most likely written with AI."}, {"start": 280.845, "end": 283.626, "text": "Defenders had to spend time checking which ones were real."}, {"start": 284.476, "end": 286.938, "text": "The third trend is influence operations."}, {"start": 287.388, "end": 292.102, "text": "Google says, with high confidence, that these groups now use AI routinely."}, {"start": 292.552, "end": 294.494, "text": "The report sorts them into three types."}, {"start": 294.944, "end": 298.967, "text": "State sponsored groups, including those linked to Russia, China and Iran."}, {"start": 299.417, "end": 301.42, "text": "Commercial influence for hire vendors."}, {"start": 301.87, "end": 305.599, "text": "And networks that publish political clickbait purely for advertising money."}, {"start": 306.449, "end": 313.375, "text": "The most striking case is a turnkey platform from a commercial contractor, built to manage more than one hundred thousand accounts."}, {"start": 313.825, "end": 317.895, "text": "It ran virtual smartphones in the cloud, disguised as real devices."}, {"start": 318.345, "end": 326.167, "text": "New accounts were aged, with AI simulating normal behaviour like scrolling and lingering on posts, before any campaign messages went out."}, {"start": 326.617, "end": 334.766, "text": "In a separate operation, prompts asked for regional slang, deliberate typos, and grainy photos, so the content would look less machine made."}, {"start": 335.216, "end": 339.379, "text": "Both used Google's own Gemini API alongside other AI providers."}, {"start": 339.829, "end": 341.292, "text": "Google adds a caution though."}, {"start": 341.742, "end": 344.542, "text": "Better content does not automatically mean more impact."}, {"start": 345.392, "end": 349.245, "text": "The fourth trend follows the money, and it is called LLMjacking."}, {"start": 349.695, "end": 360.077, "text": "Attackers steal cloud credentials or AI platform keys, often from public code repositories, build pipelines or fake login pages, then run up the victim's AI usage."}, {"start": 360.527, "end": 364.178, "text": "Mandiant responded to several of these cases during 2026."}, {"start": 364.628, "end": 369.415, "text": "In some, the fraudulent charges passed one hundred thousand US dollars in a single day."}, {"start": 369.865, "end": 374.029, "text": "In the most severe, the total reached one million dollars before it was stopped."}, {"start": 374.879, "end": 381.021, "text": "Inside the victim's cloud, attackers created their own service accounts, or gave existing ones admin rights."}, {"start": 381.471, "end": 388.486, "text": "One exploited a flaw in LiteLLM, an open source AI gateway, to turn a limited key into full admin access."}, {"start": 388.936, "end": 392.948, "text": "Another kept creating and deleting short lived accounts to get around rate limits."}, {"start": 393.398, "end": 396.77, "text": "Others spun up powerful GPU machines in the victim's account."}, {"start": 397.22, "end": 403.097, "text": "In one case, a botnet made millions of AI calls in about twenty four hours before the keys were revoked."}, {"start": 403.947, "end": 405.763, "text": "Where does that stolen access end up?"}, {"start": 406.213, "end": 408.684, "text": "Often in what Google calls LLM mixers."}, {"start": 409.134, "end": 418.554, "text": "These underground storefronts resell AI access, routing buyers through a pool of stolen credentials, spread across many victims so no single account looks too busy."}, {"start": 419.004, "end": 423.087, "text": "Advertised prices ranged from ten cents to twenty five dollars per million tokens."}, {"start": 423.937, "end": 426.28, "text": "Government backed groups are using AI too."}, {"start": 426.73, "end": 435.236, "text": "Iran's CALANQUE ION, previously tracked as APT42, uses models including Gemini for reconnaissance and social engineering."}, {"start": 435.686, "end": 440.867, "text": "China linked actors use AI for scanning, weaponising exploits and analysing stolen data."}, {"start": 441.317, "end": 445.682, "text": "North Korean IT workers use it to write resumes and get through job interviews."}, {"start": 446.532, "end": 450.761, "text": "One North Korea linked case matters to anyone who uses AI coding tools."}, {"start": 451.211, "end": 459.539, "text": "A suspected cluster called MIDNIGHT NEPTUNE targeted cryptocurrency firms with fake recruiter profiles and fake meeting sites that tricked people into running a fix script."}, {"start": 459.989, "end": 465.454, "text": "Once inside, the attackers changed Claude Code settings files in internal code repositories."}, {"start": 465.904, "end": 470.817, "text": "The next time a developer started Claude Code, it downloaded a backdoor called SOMBERMEME."}, {"start": 471.267, "end": 475.857, "text": "They even named their GitHub access tokens after Microsoft Copilot, to blend in."}, {"start": 476.707, "end": 479.03, "text": "Google's response covers several layers."}, {"start": 479.48, "end": 487.382, "text": "It disables accounts tied to abuse, feeds what it learns back into Gemini's safety classifiers, and has detection rules for the ARTEX framework."}, {"start": 487.832, "end": 493.616, "text": "It points to its own defensive agents, Big Sleep and CodeMender, which find and fix vulnerabilities."}, {"start": 494.066, "end": 499.872, "text": "And it says its new Gemini 4 Carbon model has layered defences against being used to build working exploits."}, {"start": 500.722, "end": 502.617, "text": "So what does this mean in practice?"}, {"start": 503.067, "end": 505.552, "text": "These are our takeaways, not the report's wording."}, {"start": 506.002, "end": 511.901, "text": "First, the patch window is shrinking, so internet facing systems need patching in days, not weeks."}, {"start": 512.351, "end": 516.138, "text": "Second, treat AI keys and cloud credentials like cash."}, {"start": 516.588, "end": 520.047, "text": "Keep them out of code, rotate them, and set spending alerts."}, {"start": 520.497, "end": 525.528, "text": "Third, treat AI agent configuration files as code, and review changes to them."}, {"start": 525.978, "end": 528.927, "text": "And fourth, the noise these tools make is an opportunity."}, {"start": 529.377, "end": 532.714, "text": "Sudden bursts of traffic and new service accounts are worth alerting on."}, {"start": 533.564, "end": 534.944, "text": "The report's message is simple."}, {"start": 535.394, "end": 538.049, "text": "The techniques are familiar, but the speed is new."}, {"start": 538.499, "end": 545.788, "text": "Attackers are moving step by step toward fully agentic intrusions, and defenders will increasingly need automation of their own to keep up."}], "duration": 546.19};
