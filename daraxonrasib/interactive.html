": 303.53}, {"text": "in", "start": 304.198}, {"text": "the", "start": 304.38}, {"text": "blood.", "start": 304.623}, {"text": "The", "start": 305.498}, {"text": "next", "start": 305.718}, {"text": "step", "start": 305.994}, {"text": "is", "start": 306.269}, {"text": "combinations,", "start": 306.434}, {"text": "to", "start": 307.205}, {"text": "shut", "start": 307.37}, {"text": "down", "start": 307.645}, {"text": "the", "start": 307.92}, {"text": "escape", "start": 308.141}, {"text": "routes.", "start": 308.526}, {"text": "Daraxonrasib", "start": 309.416}, {"text": "shows", "start": 310.15}, {"text": "that", "start": 310.488}, {"text": "an", "start": 310.77}, {"text": "undruggable", "start": 310.939}, {"text": "target", "start": 311.616}, {"text": "can", "start": 312.011}, {"text": "be", "start": 312.236}, {"text": "hit.", "start": 312.406}, {"text": "This", "start": 313.138}, {"text": "is", "start": 313.467}, {"text": "an", "start": 313.664}, {"text": "exciting", "start": 313.861}, {"text": "time,", "start": 314.453}, {"text": "where", "start": 314.848}, {"text": "genetics,", "start": 315.243}, {"text": "maths", "start": 315.901}, {"text": "and", "start": 316.295}, {"text": "AI", "start": 316.558}, {"text": "meet.", "start": 316.756}], "scenes": [{"start": 0, "w0": 0}, {"start": 22.366, "w0": 60}, {"start": 36.267, "w0": 108}, {"start": 51.251000000000005, "w0": 152}, {"start": 64.855, "w0": 194}, {"start": 83.311, "w0": 244}, {"start": 105.818, "w0": 303}, {"start": 130.91, "w0": 357}, {"start": 151.509, "w0": 411}, {"start": 173.07, "w0": 473}, {"start": 198.94299999999998, "w0": 544}, {"start": 228.52599999999998, "w0": 624}, {"start": 242.755, "w0": 660}, {"start": 270.884, "w0": 734}, {"start": 294.768, "w0": 800}], "sentences": [{"start": 0.05, "end": 2.053, "text": "Picture two scans of the same person."}, {"start": 2.503, "end": 5.117, "text": "In the first, the liver is dotted with tumours."}, {"start": 5.567, "end": 10.056, "text": "A few months later, on a daily pill, those tumours can no longer be seen."}, {"start": 10.506, "end": 14.116, "text": "This is pancreatic cancer, the deadliest of the common cancers."}, {"start": 14.566, "end": 20.396, "text": "The drug is called daraxonrasib, and specialists have called it the biggest step forward in decades."}, {"start": 20.846, "end": 21.816, "text": "So what changed?"}, {"start": 22.666, "end": 24.487, "text": "Start with a protein called RAS."}, {"start": 24.937, "end": 27.264, "text": "Think of it as the accelerator pedal for cell growth."}, {"start": 27.714, "end": 32.185, "text": "Normally it is pressed only when the body sends a signal to grow, and then it lifts again."}, {"start": 32.635, "end": 35.717, "text": "RAS passes that go signal down a cable to the rest of the cell."}, {"start": 36.567, "end": 39.681, "text": "A mutation in the RAS gene jams the pedal to the floor."}, {"start": 40.131, "end": 44.004, "text": "The cable glows with a constant grow signal, and the cell keeps dividing."}, {"start": 44.454, "end": 48.073, "text": "More than nine in ten pancreatic cancers carry a RAS mutation."}, {"start": 48.523, "end": 50.701, "text": "That is why hitting RAS matters so much."}, {"start": 51.551, "end": 55.409, "text": "The trouble is that for about forty years, RAS was called undruggable."}, {"start": 55.859, "end": 60.184, "text": "Most drugs work by slipping into a pocket on a protein, like a key into a lock."}, {"start": 60.634, "end": 64.305, "text": "RAS is small and smooth, with almost nowhere for a drug to grip."}, {"start": 65.155, "end": 67.792, "text": "Daraxonrasib gets around this in a clever way."}, {"start": 68.242, "end": 73.216, "text": "First it binds a helper protein already inside our cells, called cyclophilin A."}, {"start": 73.666, "end": 78.18, "text": "Together, the pair forms a new surface that clamps onto RAS while it is switched on."}, {"start": 78.63, "end": 81.144, "text": "That clamp blocks RAS from passing on its signal."}, {"start": 81.594, "end": 82.761, "text": "The cable goes dark."}, {"start": 83.611, "end": 93.17, "text": "Earlier drugs, sotorasib and adagrasib, could only hit one version of the mutation, called G12C, which is rare in pancreatic cancer."}, {"start": 93.62, "end": 97.404, "text": "Daraxonrasib is designed to hit most RAS mutations at once."}, {"start": 97.854, "end": 102.541, "text": "It blocks the faulty protein but does not fix the gene, so the drug has to keep working."}, {"start": 102.991, "end": 105.268, "text": "That is why it is a pill taken every day."}, {"start": 106.118, "end": 109.58, "text": "The proof came from a large trial called RASolute 302."}, {"start": 110.03, "end": 116.708, "text": "About five hundred people whose cancer had grown after chemotherapy were given either daraxonrasib or more chemo."}, {"start": 117.158, "end": 123.99, "text": "Median survival was 13.2 months on daraxonrasib, against 6.7 months on chemo."}, {"start": 124.44, "end": 125.518, "text": "That is roughly double."}, {"start": 125.968, "end": 130.36, "text": "In August 2026, the US Food and Drug Administration approved it."}, {"start": 131.21, "end": 135.379, "text": "Doctors are now testing it earlier, alongside chemo as the first treatment."}, {"start": 135.829, "end": 140.053, "text": "In an early study, tumours shrank in 58 percent of 40 patients."}, {"start": 140.503, "end": 141.617, "text": "But this is not a cure."}, {"start": 142.067, "end": 146.444, "text": "Many people get skin rashes, diarrhoea, nausea or mouth sores."}, {"start": 146.894, "end": 150.959, "text": "And in time, cancers can find ways around the block and start growing again."}, {"start": 151.809, "end": 155.172, "text": "RAS mutations also drive many lung and bowel cancers."}, {"start": 155.622, "end": 162.939, "text": "In people with RAS mutant lung cancer who had already been treated, tumours shrank in about 42 percent at the doses now being tested."}, {"start": 163.389, "end": 172.52, "text": "A large phase 3 lung trial is under way, bowel cancer studies are testing it in combinations, and basket trials are trying it across many cancer types at once."}, {"start": 173.37, "end": 174.614, "text": "Here is something important."}, {"start": 175.064, "end": 177.384, "text": "Daraxonrasib was not found by AI."}, {"start": 177.834, "end": 184.533, "text": "It came from classic science: crystallography to see protein shapes at the level of atoms, and years of patient chemistry."}, {"start": 184.983, "end": 189.844, "text": "But many of the tools for doing this again, faster, now come from AI and data."}, {"start": 190.294, "end": 191.383, "text": "Start with sequencing."}, {"start": 191.833, "end": 198.393, "text": "Reading a tumour's DNA has become cheap and fast, so doctors can find who has a RAS mutation in the first place."}, {"start": 199.243, "end": 200.275, "text": "Next comes shape."}, {"start": 200.725, "end": 212.041, "text": "AlphaFold predicts a protein's three dimensional shape from its sequence, and its creators, Demis Hassabis and John Jumper, shared the 2024 Nobel Prize in Chemistry with David Baker."}, {"start": 212.491, "end": 217.636, "text": "AlphaFold 3 goes further, predicting how proteins fit with drugs and other molecules."}, {"start": 218.086, "end": 219.774, "text": "But a prediction is not a medicine."}, {"start": 220.224, "end": 223.933, "text": "As chemists like to say, a key can fit a lock and still be made of soap."}, {"start": 224.383, "end": 227.976, "text": "It still has to be safe, stable and actually reach the tumour."}, {"start": 228.826, "end": 235.112, "text": "Baker's lab goes the other way and designs brand new proteins from scratch, including ones that grip hard targets."}, {"start": 235.562, "end": 242.205, "text": "Designed proteins can also guide antibody drug conjugates, which deliver a toxic payload straight to cancer cells."}, {"start": 243.055, "end": 244.57, "text": "Trials are getting smarter too."}, {"start": 245.02, "end": 250.356, "text": "Synthetic control arms use data from past patients, so fewer people need to get the older treatment."}, {"start": 250.806, "end": 257.172, "text": "And liquid biopsies read tiny fragments of tumour DNA in the blood, called ctDNA."}, {"start": 257.622, "end": 262.31, "text": "They can spot resistance early, like the T790M mutation in lung cancer."}, {"start": 262.76, "end": 270.334, "text": "In the SERENA-6 trial in breast cancer, switching treatment as soon as a resistance mutation appeared in the blood kept the cancer in check for longer."}, {"start": 271.184, "end": 272.905, "text": "Underneath all this is maths."}, {"start": 273.355, "end": 279.438, "text": "DNA language models, like Evo 2, learn the grammar of genes from huge amounts of sequence."}, {"start": 279.888, "end": 285.784, "text": "AlphaMissense uses similar ideas to predict which single letter changes in a gene are likely to cause harm."}, {"start": 286.234, "end": 294.218, "text": "And AlphaFold is built so its answer does not change when a molecule is rotated in space, an idea from the maths of symmetry called group theory."}, {"start": 295.068, "end": 296.823, "text": "Put it together and you have a full loop."}, {"start": 297.273, "end": 305.048, "text": "Read the tumour's DNA, find the target, see its shape, design the drug, test it smartly, and watch for resistance in the blood."}, {"start": 305.498, "end": 308.966, "text": "The next step is combinations, to shut down the escape routes."}, {"start": 309.416, "end": 312.688, "text": "Daraxonrasib shows that an undruggable target can be hit."}, {"start": 313.138, "end": 317.15, "text": "This is an exciting time, where genetics, maths and AI meet."}], "duration": 317.55};
