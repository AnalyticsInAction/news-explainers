445.234}, {"text": "now", "start": 445.398}, {"text": "often", "start": 445.616}, {"text": "managed", "start": 445.944}, {"text": "for", "start": 446.38}, {"text": "years", "start": 446.599}, {"text": "with", "start": 446.926}, {"text": "combination", "start": 447.199}, {"text": "treatment.", "start": 447.854}, {"text": "The", "start": 448.904}, {"text": "melanoma", "start": 449.126}, {"text": "lab", "start": 449.623}, {"text": "results", "start": 449.845}, {"text": "will", "start": 450.287}, {"text": "give", "start": 450.564}, {"text": "its", "start": 450.84}, {"text": "stage,", "start": 451.061}, {"text": "and", "start": 451.448}, {"text": "the", "start": 451.67}, {"text": "stage", "start": 451.891}, {"text": "guides", "start": 452.223}, {"text": "what", "start": 452.61}, {"text": "comes", "start": 452.886}, {"text": "next.", "start": 453.218}, {"text": "In", "start": 454.0}, {"text": "fifteen", "start": 454.172}, {"text": "years,", "start": 454.631}, {"text": "immunotherapy", "start": 455.032}, {"text": "and", "start": 455.835}, {"text": "tumour", "start": 456.064}, {"text": "gene", "start": 456.466}, {"text": "testing", "start": 456.752}, {"text": "have", "start": 457.211}, {"text": "transformed", "start": 457.498}, {"text": "melanoma", "start": 458.186}, {"text": "care.", "start": 458.702}, {"text": "With", "start": 459.496}, {"text": "two", "start": 459.785}, {"text": "cancers,", "start": 460.016}, {"text": "the", "start": 460.537}, {"text": "key", "start": 460.768}, {"text": "is", "start": 460.999}, {"text": "two", "start": 461.173}, {"text": "teams", "start": 461.404}, {"text": "planning", "start": 461.751}, {"text": "together,", "start": 462.272}, {"text": "watching", "start": 462.85}, {"text": "for", "start": 463.37}, {"text": "infections,", "start": 463.602}, {"text": "and", "start": 464.296}, {"text": "asking", "start": 464.527}, {"text": "good", "start": 464.932}, {"text": "questions.", "start": 465.221}, {"text": "This", "start": 466.307}, {"text": "video", "start": 466.602}, {"text": "is", "start": 466.957}, {"text": "general", "start": 467.134}, {"text": "information,", "start": 467.606}, {"text": "not", "start": 468.374}, {"text": "medical", "start": 468.61}, {"text": "advice.", "start": 469.082}, {"text": "Please", "start": 470.005}, {"text": "talk", "start": 470.278}, {"text": "to", "start": 470.473}, {"text": "your", "start": 470.59}, {"text": "own", "start": 470.785}, {"text": "doctors", "start": 470.942}, {"text": "about", "start": 471.254}, {"text": "your", "start": 471.488}, {"text": "treatment.", "start": 471.683}], "scenes": [{"start": 0, "w0": 0}, {"start": 25.023, "w0": 74}, {"start": 52.555, "w0": 145}, {"start": 92.164, "w0": 253}, {"start": 111.51100000000001, "w0": 309}, {"start": 148.15699999999998, "w0": 411}, {"start": 165.553, "w0": 455}, {"start": 193.173, "w0": 524}, {"start": 215.327, "w0": 590}, {"start": 256.662, "w0": 704}, {"start": 292.32599999999996, "w0": 804}, {"start": 312.199, "w0": 863}, {"start": 338.894, "w0": 931}, {"start": 378.738, "w0": 1030}, {"start": 412.329, "w0": 1118}, {"start": 443.45599999999996, "w0": 1202}], "sentences": [{"start": 0.05, "end": 4.482, "text": "This video was made for a friend in his seventies who is living with two cancers at once."}, {"start": 4.932, "end": 9.5, "text": "One is multiple myeloma, a blood cancer, which he is already being treated for."}, {"start": 9.95, "end": 14.298, "text": "The other is a melanoma, a skin cancer, which has just been removed by surgery."}, {"start": 14.748, "end": 20.172, "text": "It explains both in general terms, how much treatment has improved, and good questions to ask."}, {"start": 20.622, "end": 22.164, "text": "It is not medical advice."}, {"start": 22.614, "end": 24.473, "text": "His own doctors know his details."}, {"start": 25.323, "end": 26.409, "text": "Start with myeloma."}, {"start": 26.859, "end": 29.7, "text": "Deep inside the bone marrow live plasma cells."}, {"start": 30.15, "end": 33.879, "text": "Their job is to make antibodies, the proteins that fight infection."}, {"start": 34.329, "end": 38.802, "text": "In myeloma, one plasma cell goes wrong and copies itself again and again."}, {"start": 39.252, "end": 45.636, "text": "These copies crowd the marrow and pour out one useless antibody, which doctors track in blood tests as the paraprotein."}, {"start": 46.086, "end": 52.005, "text": "Over time this can weaken bones, strain the kidneys, cause anaemia, and make infections more likely."}, {"start": 52.855, "end": 58.973, "text": "Today myeloma is usually treated with a combination of drugs, often three at once, called triple therapy."}, {"start": 59.423, "end": 61.091, "text": "Each drug attacks in a different way."}, {"start": 61.541, "end": 69.642, "text": "A common example for people not having a stem cell transplant is daratumumab, an antibody that tags myeloma cells for the immune system."}, {"start": 70.092, "end": 73.672, "text": "Then lenalidomide, a tablet that boosts the immune attack."}, {"start": 74.122, "end": 77.768, "text": "And dexamethasone, a steroid that helps the other two work."}, {"start": 78.218, "end": 84.602, "text": "In the large MAIA trial of this combination, half the people were still alive after about seven and a half years."}, {"start": 85.052, "end": 91.614, "text": "Myeloma is not usually cured, but for many people it is now managed for years, more like a long term condition."}, {"start": 92.464, "end": 93.405, "text": "Now the melanoma."}, {"start": 93.855, "end": 99.554, "text": "The surgeon removes the melanoma with a wide border of healthy skin, and checks the nearby lymph nodes."}, {"start": 100.004, "end": 103.26, "text": "Lymph nodes are small filters that drain fluid from the skin."}, {"start": 103.71, "end": 108.035, "text": "If melanoma cells break away, these nodes are often the first place they settle."}, {"start": 108.485, "end": 110.961, "text": "The first node in line is called the sentinel node."}, {"start": 111.811, "end": 121.465, "text": "Under the microscope, the pathologist measures how thick the melanoma is, whether the skin over it had broken down, and how many lymph nodes actually contain melanoma."}, {"start": 121.915, "end": 123.402, "text": "Together these give the stage."}, {"start": 123.852, "end": 128.874, "text": "If the nodes are clear, it is stage one or two, depending on the thickness and the broken skin."}, {"start": 129.324, "end": 132.407, "text": "If melanoma is found in the nodes, it is stage three."}, {"start": 132.857, "end": 139.265, "text": "A big change since 2017 is that surgeons no longer automatically remove every remaining node in that area."}, {"start": 139.715, "end": 147.607, "text": "A large trial called MSLT two found it did not help people live longer, so close checks with ultrasound are used instead."}, {"start": 148.457, "end": 150.199, "text": "Now look back fifteen years."}, {"start": 150.649, "end": 155.669, "text": "Before 2011, if melanoma spread around the body, there was almost nothing that worked."}, {"start": 156.119, "end": 159.009, "text": "Half the people died within about six to nine months."}, {"start": 159.459, "end": 162.798, "text": "Then in 2011, two new kinds of drug were approved."}, {"start": 163.248, "end": 165.003, "text": "That year changed melanoma care."}, {"start": 165.853, "end": 169.391, "text": "The first kind is immunotherapy, called checkpoint inhibitors."}, {"start": 169.841, "end": 174.036, "text": "Our immune system has soldier cells, called T cells, that can kill cancer."}, {"start": 174.486, "end": 181.106, "text": "But they have brakes, with names like P D one and C T L A four, that stop them attacking our own body."}, {"start": 181.556, "end": 183.704, "text": "Melanoma learns to press those brakes."}, {"start": 184.154, "end": 187.781, "text": "Checkpoint inhibitors release them, so the T cells can attack again."}, {"start": 188.231, "end": 192.623, "text": "The best known are pembrolizumab, nivolumab, and ipilimumab."}, {"start": 193.473, "end": 194.863, "text": "The results have been remarkable."}, {"start": 195.313, "end": 203.808, "text": "In the CheckMate zero six seven trial for melanoma that had spread, people given nivolumab and ipilimumab together lived a median of almost six years."}, {"start": 204.258, "end": 210.686, "text": "And of those who were alive and free of growth at three years, ninety six percent had not died of melanoma ten years on."}, {"start": 211.136, "end": 214.777, "text": "For melanoma that has spread, that was unheard of fifteen years ago."}, {"start": 215.627, "end": 220.661, "text": "These drugs are now also used straight after surgery, to lower the chance of the melanoma coming back."}, {"start": 221.111, "end": 225.86, "text": "This is called adjuvant treatment, usually about a year of pembrolizumab or nivolumab."}, {"start": 226.31, "end": 235.661, "text": "In the KEYNOTE zero five four trial, after seven years, half the people on pembrolizumab were alive with no return of melanoma, compared with about a third on a dummy drug."}, {"start": 236.111, "end": 237.745, "text": "The trade off is side effects."}, {"start": 238.195, "end": 243.805, "text": "A released immune system can inflame the skin, bowel, liver, thyroid and other glands."}, {"start": 244.255, "end": 246.101, "text": "Most are manageable if reported early."}, {"start": 246.551, "end": 256.112, "text": "For melanoma found in the nodes before surgery, giving immunotherapy first, then operating, is a newer approach that worked even better in a trial called NADINA."}, {"start": 256.962, "end": 259.637, "text": "The second big advance is genetic testing of the tumour."}, {"start": 260.087, "end": 266.123, "text": "Inside each cell, a relay of proteins passes a grow signal along, like runners passing a baton."}, {"start": 266.573, "end": 272.091, "text": "R A S hands to B RAF, B RAF hands to MEK, and MEK hands to E R K."}, {"start": 272.541, "end": 274.907, "text": "Doctors call it the MAPK pathway."}, {"start": 275.357, "end": 279.218, "text": "In about forty to fifty percent of melanomas, B RAF is jammed on."}, {"start": 279.668, "end": 284.064, "text": "Another fifteen to twenty five percent have a faulty RAS gene called N RAS."}, {"start": 284.514, "end": 291.776, "text": "If the melanoma is B RAF positive, tablets that block both B RAF and MEK are another option, including after surgery."}, {"start": 292.626, "end": 293.908, "text": "Here is something interesting."}, {"start": 294.358, "end": 296.889, "text": "The same relay is often faulty in myeloma too."}, {"start": 297.339, "end": 301.698, "text": "Around half of myeloma cases carry a mutation in R A S or B RAF."}, {"start": 302.148, "end": 311.649, "text": "That does not change standard myeloma treatment today, but it is an active area of research, and it shows how cancers in very different places can share the same broken wiring."}, {"start": 312.499, "end": 314.793, "text": "So what is different about having both cancers?"}, {"start": 315.243, "end": 316.781, "text": "First, the immune system."}, {"start": 317.231, "end": 322.368, "text": "Myeloma and its treatment lower the body's normal antibodies, so infections are more likely."}, {"start": 322.818, "end": 327.868, "text": "Vaccines, quick treatment of infections, and sometimes antibody replacement drips can help."}, {"start": 328.318, "end": 330.954, "text": "Immunotherapy also relies on the immune system."}, {"start": 331.404, "end": 338.344, "text": "Some small studies suggest a blood cancer may reduce how well it works, but there is very little evidence about myeloma in particular."}, {"start": 339.194, "end": 341.095, "text": "Second, how the drugs combine."}, {"start": 341.545, "end": 352.203, "text": "In 2017, the US regulator stopped trials that added pembrolizumab to lenalidomide or pomalidomide for myeloma, because more people died on the combination."}, {"start": 352.653, "end": 357.123, "text": "In one trial there were nineteen deaths with pembrolizumab, against nine without it."}, {"start": 357.573, "end": 360.812, "text": "That does not mean immunotherapy is ruled out for melanoma."}, {"start": 361.262, "end": 364.741, "text": "It means the myeloma and melanoma teams need to plan together."}, {"start": 365.191, "end": 366.415, "text": "Steroids matter too."}, {"start": 366.865, "end": 372.161, "text": "Some studies link steroids at the start of immunotherapy with less benefit, though that evidence is mixed."}, {"start": 372.611, "end": 378.188, "text": "And lenalidomide raises the risk of other skin cancers, so regular skin checks are worth keeping up."}, {"start": 379.038, "end": 382.489, "text": "Some useful questions to take to the oncologist and haematologist."}, {"start": 382.939, "end": 386.272, "text": "What stage is the melanoma, and how many nodes contained it?"}, {"start": 386.722, "end": 389.975, "text": "Has the tumour been tested for B RAF and other gene changes?"}, {"start": 390.425, "end": 394.993, "text": "Do you recommend treatment after surgery, immunotherapy or tablets, and why?"}, {"start": 395.443, "end": 397.71, "text": "How does that fit with my myeloma drugs?"}, {"start": 398.16, "end": 402.93, "text": "Should anything pause or change, especially lenalidomide or the steroid?"}, {"start": 403.38, "end": 405.196, "text": "Will both teams plan this together?"}, {"start": 405.646, "end": 409.044, "text": "Which infections and side effects should I report, and to whom?"}, {"start": 409.494, "end": 411.779, "text": "And is it funded, or is there a cost?"}, {"start": 412.629, "end": 414.886, "text": "Finally, ask about clinical trials."}, {"start": 415.336, "end": 425.495, "text": "One to watch is a personalised m R N A vaccine called intismeran, designed from the gene changes in each person's own tumour and given with pembrolizumab after surgery."}, {"start": 425.945, "end": 434.781, "text": "In a trial of more than eleven hundred people, it lowered the risk of melanoma coming back, or death, by forty two percent compared with pembrolizumab alone."}, {"start": 435.231, "end": 436.56, "text": "It is not approved yet."}, {"start": 437.01, "end": 442.906, "text": "Many trials exclude people with a second active cancer, so ask directly whether any trial would accept you."}, {"start": 443.756, "end": 444.347, "text": "To sum up."}, {"start": 444.797, "end": 448.454, "text": "Myeloma is now often managed for years with combination treatment."}, {"start": 448.904, "end": 453.55, "text": "The melanoma lab results will give its stage, and the stage guides what comes next."}, {"start": 454.0, "end": 459.046, "text": "In fifteen years, immunotherapy and tumour gene testing have transformed melanoma care."}, {"start": 459.496, "end": 465.857, "text": "With two cancers, the key is two teams planning together, watching for infections, and asking good questions."}, {"start": 466.307, "end": 469.555, "text": "This video is general information, not medical advice."}, {"start": 470.005, "end": 472.113, "text": "Please talk to your own doctors about your treatment."}], "duration": 472.51};
