And", "start": 438.443}, {"text": "the", "start": 438.653}, {"text": "exact", "start": 438.863}, {"text": "form", "start": 439.178}, {"text": "of", "start": 439.441}, {"text": "a", "start": 439.599}, {"text": "service", "start": 439.704}, {"text": "principal's", "start": 440.124}, {"text": "user", "start": 440.755}, {"text": "ID", "start": 441.018}, {"text": "is", "start": 441.228}, {"text": "something", "start": 441.385}, {"text": "to", "start": 441.911}, {"text": "confirm", "start": 442.068}, {"text": "in", "start": 442.489}, {"text": "your", "start": 442.647}, {"text": "own", "start": 442.909}, {"text": "tenant.", "start": 443.119}, {"text": "So,", "start": 444.39}, {"text": "two", "start": 444.684}, {"text": "identities", "start": 444.978}, {"text": "and", "start": 445.786}, {"text": "two", "start": 446.08}, {"text": "trails.", "start": 446.374}, {"text": "Use", "start": 447.411}, {"text": "the", "start": 447.599}, {"text": "hosted", "start": 447.787}, {"text": "server", "start": 448.115}, {"text": "when", "start": 448.443}, {"text": "you", "start": 448.678}, {"text": "want", "start": 448.866}, {"text": "each", "start": 449.1}, {"text": "person's", "start": 449.335}, {"text": "Claude", "start": 449.757}, {"text": "Code", "start": 450.085}, {"text": "use", "start": 450.32}, {"text": "tied", "start": 450.507}, {"text": "to", "start": 450.742}, {"text": "their", "start": 450.883}, {"text": "name.", "start": 451.164}, {"text": "Use", "start": 451.896}, {"text": "a", "start": 452.094}, {"text": "dedicated", "start": 452.193}, {"text": "service", "start": 452.689}, {"text": "principal", "start": 453.085}, {"text": "on", "start": 453.581}, {"text": "the", "start": 453.73}, {"text": "local", "start": 453.928}, {"text": "server", "start": 454.226}, {"text": "when", "start": 454.573}, {"text": "you", "start": 454.82}, {"text": "want", "start": 455.019}, {"text": "Claude", "start": 455.267}, {"text": "Code", "start": 455.614}, {"text": "to", "start": 455.862}, {"text": "have", "start": 456.01}, {"text": "its", "start": 456.258}, {"text": "own,", "start": 456.456}, {"text": "tightly", "start": 456.704}, {"text": "scoped", "start": 457.101}, {"text": "identity.", "start": 457.448}, {"text": "Either", "start": 458.394}, {"text": "way,", "start": 458.77}, {"text": "a", "start": 459.038}, {"text": "second", "start": 459.146}, {"text": "service", "start": 459.521}, {"text": "principal", "start": 459.951}, {"text": "reads", "start": 460.488}, {"text": "the", "start": 460.81}, {"text": "log", "start": 461.025}, {"text": "every", "start": 461.24}, {"text": "day,", "start": 461.562}, {"text": "and", "start": 461.83}, {"text": "one", "start": 462.045}, {"text": "test", "start": 462.26}, {"text": "call", "start": 462.529}, {"text": "tells", "start": 462.797}, {"text": "you", "start": 463.119}, {"text": "exactly", "start": 463.334}, {"text": "what", "start": 463.764}, {"text": "to", "start": 464.032}, {"text": "filter", "start": 464.193}, {"text": "on.", "start": 464.569}], "scenes": [{"start": 0, "w0": 0}, {"start": 23.537, "w0": 67}, {"start": 44.695, "w0": 132}, {"start": 64.158, "w0": 189}, {"start": 90.023, "w0": 255}, {"start": 113.19800000000001, "w0": 318}, {"start": 141.56099999999998, "w0": 386}, {"start": 167.45999999999998, "w0": 464}, {"start": 200.628, "w0": 550}, {"start": 230.93099999999998, "w0": 618}, {"start": 261.11199999999997, "w0": 693}, {"start": 291.781, "w0": 776}, {"start": 324.966, "w0": 862}, {"start": 353.24199999999996, "w0": 939}, {"start": 387.846, "w0": 1011}, {"start": 415.603, "w0": 1088}, {"start": 444.09, "w0": 1166}], "sentences": [{"start": 0.05, "end": 4.557, "text": "You've connected Claude Code to Power BI through Microsoft's MCP servers."}, {"start": 5.007, "end": 9.593, "text": "It can read your semantic models, run DAX queries, and even change measures."}, {"start": 10.043, "end": 11.618, "text": "So here is the governance question."}, {"start": 12.068, "end": 19.266, "text": "If you give Claude Code its own identity, a service principal, will its activity show up in the tenant activity log under that identity?"}, {"start": 19.716, "end": 22.987, "text": "And how would you find it, filter it, and track it over time?"}, {"start": 23.837, "end": 28.866, "text": "The short answer is: it depends on which MCP server you use, and on who signs in."}, {"start": 29.316, "end": 32.467, "text": "Today, the hosted servers sign in as you, the person."}, {"start": 32.917, "end": 39.953, "text": "The local server can sign in as a service principal, but Microsoft says it doesn't write MCP events to the Fabric audit log."}, {"start": 40.403, "end": 44.145, "text": "So you can track this usage, but you need to know which trail to follow."}, {"start": 44.995, "end": 48.046, "text": "First, separate two jobs a service principal can do here."}, {"start": 48.496, "end": 49.713, "text": "The first is the actor."}, {"start": 50.163, "end": 53.423, "text": "That's the identity Claude Code uses when it touches your models."}, {"start": 53.873, "end": 54.938, "text": "The second is the auditor."}, {"start": 55.388, "end": 59.055, "text": "That's a script, running on a schedule, that reads the activity log."}, {"start": 59.505, "end": 63.608, "text": "They need different permissions, and mixing them up is the most common setup mistake."}, {"start": 64.458, "end": 65.442, "text": "Now the servers."}, {"start": 65.892, "end": 67.458, "text": "Microsoft documents three."}, {"start": 67.908, "end": 81.654, "text": "The Power BI Authoring MCP server comes in two forms: a hosted version, in preview, at an endpoint on api dot fabric dot microsoft dot com, and a local version that runs on your machine, which is generally available."}, {"start": 82.104, "end": 89.473, "text": "There's also the older consumption server for querying, also in preview, although Microsoft now points to Fabric IQ for that job."}, {"start": 90.323, "end": 92.162, "text": "Start with the hosted Authoring server."}, {"start": 92.612, "end": 96.202, "text": "It authenticates with Microsoft Entra, as the signed in user."}, {"start": 96.652, "end": 102.357, "text": "The first time Claude Code calls a tool, you sign in, and the server then acts with your permissions."}, {"start": 102.807, "end": 104.426, "text": "There's no service principal option."}, {"start": 104.876, "end": 112.648, "text": "A Fabric administrator also has to turn on the tenant setting called, Users can use the Power BI Model Context Protocol server endpoint."}, {"start": 113.498, "end": 115.931, "text": "The good news is that the hosted server is logged."}, {"start": 116.381, "end": 119.413, "text": "Microsoft's operation list has two activities for it."}, {"start": 119.863, "end": 124.908, "text": "ReadByPowerBIMCP means an MCP tool read semantic model metadata."}, {"start": 125.358, "end": 129.902, "text": "ModifiedByPowerBIMCP means an MCP tool changed the model."}, {"start": 130.352, "end": 134.457, "text": "Microsoft is explicit that only the hosted server logs these activities."}, {"start": 134.907, "end": 141.011, "text": "So every Claude Code session on the hosted server shows up under the user's name, with one of those two activity names."}, {"start": 141.861, "end": 144.31, "text": "What if you want Claude Code to have its own identity?"}, {"start": 144.76, "end": 146.21, "text": "Then you use the local server."}, {"start": 146.66, "end": 155.524, "text": "Its auth mode can be set to service principal, and it reads the app's client ID, tenant ID, and a secret or certificate from environment variables."}, {"start": 155.974, "end": 162.02, "text": "In Claude Code, you add it with the claude mcp add command, passing those variables and the start flag."}, {"start": 162.47, "end": 166.91, "text": "Keep the secret in a vault or an environment variable, never in a shared config file."}, {"start": 167.76, "end": 172.921, "text": "The actor needs real permissions, because the local server talks to the XMLA endpoint."}, {"start": 173.371, "end": 180.963, "text": "A Fabric admin enables the developer setting, Service principals can call Fabric public APIs, ideally for one security group."}, {"start": 181.413, "end": 184.858, "text": "The service principal must be a Member or Admin of the workspace."}, {"start": 185.308, "end": 190.429, "text": "And for any changes, the capacity's XMLA endpoint must be set to read write."}, {"start": 190.879, "end": 191.539, "text": "One warning."}, {"start": 191.989, "end": 196.976, "text": "Service principals don't work with row level security, so Claude Code would see every row."}, {"start": 197.426, "end": 200.078, "text": "Give it a workspace with only the models it needs."}, {"start": 200.928, "end": 201.837, "text": "Here's the honest part."}, {"start": 202.287, "end": 209.583, "text": "Microsoft states that the local server doesn't log the MCP activities, so you won't see ReadByPowerBIMCP for it."}, {"start": 210.033, "end": 212.861, "text": "What you can see is the XMLA traffic underneath."}, {"start": 213.311, "end": 222.054, "text": "Microsoft says XMLA access is logged as activities such as ConnectFromExternalApplication, and EditDatasetFromExternalApplication."}, {"start": 222.504, "end": 228.642, "text": "Because the connection belongs to the service principal, expect those events to carry its identity rather than a person's."}, {"start": 229.092, "end": 230.381, "text": "Confirm that in your tenant."}, {"start": 231.231, "end": 232.626, "text": "There are two more trails."}, {"start": 233.076, "end": 243.515, "text": "If you turn on workspace monitoring, the semantic model logs record every command and query the local server sends, under the application name MCP-PBIModeling."}, {"start": 243.965, "end": 250.662, "text": "Those logs include the executing user, the operation and the application name, and they're kept for thirty days by default."}, {"start": 251.112, "end": 260.562, "text": "The local server also writes its own audit files on the machine, with timestamps, operation types and model identifiers, but no DAX text and no credentials."}, {"start": 261.412, "end": 264.182, "text": "Now, how does a service principal look in the log?"}, {"start": 264.632, "end": 266.297, "text": "This part isn't fully documented."}, {"start": 266.747, "end": 272.713, "text": "The Microsoft 365 audit schema defines a user type field, where six means service principal."}, {"start": 273.163, "end": 280.208, "text": "The user ID field is documented as a user principal name, but community reports show a GUID for service principal activity."}, {"start": 280.658, "end": 281.635, "text": "So don't guess."}, {"start": 282.085, "end": 289.251, "text": "Run one known test call as the service principal, then find that event and note the exact user ID and user type it carries."}, {"start": 289.701, "end": 291.231, "text": "That value becomes your filter."}, {"start": 292.081, "end": 293.841, "text": "Now the second job, the auditor."}, {"start": 294.291, "end": 297.522, "text": "Register an app in Entra, and put it in a security group."}, {"start": 297.972, "end": 308.025, "text": "In the Fabric admin portal, under admin API settings, enable, Service principals can access read only admin APIs, and choose specific security groups."}, {"start": 308.475, "end": 310.305, "text": "Then check one thing in the Azure portal."}, {"start": 310.755, "end": 314.804, "text": "The app must not have any admin consent required Power BI permissions."}, {"start": 315.254, "end": 315.982, "text": "That's the trap."}, {"start": 316.432, "end": 319.758, "text": "Tenant.Read.All is only for a delegated admin token."}, {"start": 320.208, "end": 324.416, "text": "Microsoft says it must not be present when you authenticate as a service principal."}, {"start": 325.266, "end": 329.953, "text": "The call itself is Get Activity Events, on the Power BI admin API."}, {"start": 330.403, "end": 334.457, "text": "Give a start and end time, in UTC, wrapped in single quotes."}, {"start": 334.907, "end": 339.113, "text": "Both must fall on the same UTC day, within the last twenty eight days."}, {"start": 339.563, "end": 344.954, "text": "The filter accepts only two fields, Activity and UserId, with equals and, and."}, {"start": 345.404, "end": 350.169, "text": "Results come back in chunks, so keep calling with the continuation token until there are none left."}, {"start": 350.619, "end": 352.692, "text": "And stay under two hundred requests an hour."}, {"start": 353.542, "end": 358.264, "text": "When you land the events, keep the fields that answer who, what, where and when."}, {"start": 358.714, "end": 370.715, "text": "That's Activity and Operation, UserId and UserType, CreationTime, the workspace and dataset names, IsSuccess, the client IP and user agent, and the request and activity IDs."}, {"start": 371.165, "end": 374.934, "text": "A sensible pattern is one call per activity of interest, each day."}, {"start": 375.384, "end": 382.958, "text": "For example, ReadByPowerBIMCP, ModifiedByPowerBIMCP, and ConnectFromExternalApplication."}, {"start": 383.408, "end": 387.296, "text": "Or filter on the service principal's user ID, and get everything it did."}, {"start": 388.146, "end": 392.629, "text": "Put that in a lakehouse every day, because the log only goes back twenty eight days."}, {"start": 393.079, "end": 394.871, "text": "Then you can answer the real questions."}, {"start": 395.321, "end": 397.696, "text": "Who is using Claude Code against which models?"}, {"start": 398.146, "end": 400.907, "text": "Is the service principal touching workspaces it shouldn't?"}, {"start": 401.357, "end": 403.517, "text": "Did a modification happen out of hours?"}, {"start": 403.967, "end": 407.107, "text": "For query level detail, join it to workspace monitoring."}, {"start": 407.557, "end": 415.053, "text": "And for longer history, the Purview audit log also records Power BI and Fabric events, for people with the audit logs role."}, {"start": 415.903, "end": 417.294, "text": "To finish, the limits."}, {"start": 417.744, "end": 422.617, "text": "Hosted servers act as the user, so a service principal is only an option on the local server."}, {"start": 423.067, "end": 431.632, "text": "The local server's MCP events don't reach the audit log, so you're relying on XMLA events, workspace monitoring, and local files."}, {"start": 432.082, "end": 435.148, "text": "Microsoft doesn't say whether the consumption server is logged."}, {"start": 435.598, "end": 437.993, "text": "Several pieces are in preview and will change."}, {"start": 438.443, "end": 443.54, "text": "And the exact form of a service principal's user ID is something to confirm in your own tenant."}, {"start": 444.39, "end": 446.961, "text": "So, two identities and two trails."}, {"start": 447.411, "end": 451.446, "text": "Use the hosted server when you want each person's Claude Code use tied to their name."}, {"start": 451.896, "end": 457.944, "text": "Use a dedicated service principal on the local server when you want Claude Code to have its own, tightly scoped identity."}, {"start": 458.394, "end": 464.784, "text": "Either way, a second service principal reads the log every day, and one test call tells you exactly what to filter on."}], "duration": 465.18};
