text": "AI", "start": 557.75}, {"text": "output", "start": 557.902}, {"text": "before", "start": 558.256}, {"text": "you", "start": 558.611}, {"text": "send", "start": 558.813}, {"text": "it,", "start": 559.067}, {"text": "because", "start": 559.269}, {"text": "unchecked", "start": 559.674}, {"text": "volume", "start": 560.181}, {"text": "is", "start": 560.535}, {"text": "the", "start": 560.687}, {"text": "number", "start": 560.89}, {"text": "one", "start": 561.244}, {"text": "bottleneck.", "start": 561.447}, {"text": "As", "start": 562.505}, {"text": "one", "start": 562.69}, {"text": "executive", "start": 562.937}, {"text": "put", "start": 563.554}, {"text": "it,", "start": 563.801}, {"text": "a", "start": 564.048}, {"text": "mediocre", "start": 564.171}, {"text": "engineer", "start": 564.727}, {"text": "with", "start": 565.283}, {"text": "an", "start": 565.591}, {"text": "AI", "start": 565.776}, {"text": "is", "start": 565.962}, {"text": "a", "start": 566.147}, {"text": "menace", "start": 566.27}, {"text": "to", "start": 566.703}, {"text": "society.", "start": 566.888}, {"text": "And", "start": 567.893}, {"text": "if", "start": 568.114}, {"text": "your", "start": 568.28}, {"text": "own", "start": 568.556}, {"text": "work", "start": 568.776}, {"text": "is", "start": 569.052}, {"text": "reports", "start": 569.218}, {"text": "and", "start": 569.659}, {"text": "dashboards,", "start": 569.88}, {"text": "expect", "start": 570.542}, {"text": "it", "start": 570.928}, {"text": "to", "start": 571.094}, {"text": "move", "start": 571.259}, {"text": "toward", "start": 571.535}, {"text": "advice", "start": 571.922}, {"text": "and", "start": 572.308}, {"text": "insight,", "start": 572.529}, {"text": "and", "start": 573.025}, {"text": "get", "start": 573.246}, {"text": "there", "start": 573.467}, {"text": "first.", "start": 573.798}, {"text": "One", "start": 575.034}, {"text": "last", "start": 575.286}, {"text": "point.", "start": 575.6}, {"text": "Models", "start": 576.491}, {"text": "improve", "start": 576.866}, {"text": "every", "start": 577.296}, {"text": "few", "start": 577.618}, {"text": "months,", "start": 577.833}, {"text": "so", "start": 578.262}, {"text": "do", "start": 578.423}, {"text": "not", "start": 578.584}, {"text": "lock", "start": 578.799}, {"text": "yourself", "start": 579.067}, {"text": "into", "start": 579.55}, {"text": "a", "start": 579.819}, {"text": "plan", "start": 579.926}, {"text": "built", "start": 580.194}, {"text": "for", "start": 580.517}, {"text": "today's", "start": 580.731}, {"text": "capabilities.", "start": 581.161}, {"text": "As", "start": 582.362}, {"text": "one", "start": 582.534}, {"text": "HR", "start": 582.764}, {"text": "manager", "start": 582.936}, {"text": "said,", "start": 583.395}, {"text": "you", "start": 583.74}, {"text": "wait", "start": 583.969}, {"text": "three", "start": 584.256}, {"text": "months,", "start": 584.601}, {"text": "something", "start": 585.06}, {"text": "new", "start": 585.634}, {"text": "is", "start": 585.864}, {"text": "possible,", "start": 586.036}, {"text": "and", "start": 586.61}, {"text": "you", "start": 586.84}, {"text": "revise", "start": 587.069}, {"text": "your", "start": 587.471}, {"text": "whole", "start": 587.758}, {"text": "plan.", "start": 588.102}, {"text": "The", "start": 588.897}, {"text": "people", "start": 589.072}, {"text": "who", "start": 589.379}, {"text": "do", "start": 589.555}, {"text": "well", "start": 589.686}, {"text": "will", "start": 589.906}, {"text": "be", "start": 590.125}, {"text": "the", "start": 590.256}, {"text": "ones", "start": 590.432}, {"text": "who", "start": 590.651}, {"text": "keep", "start": 590.827}, {"text": "moving", "start": 591.046}, {"text": "to", "start": 591.353}, {"text": "wherever", "start": 591.485}, {"text": "the", "start": 591.879}, {"text": "bottleneck", "start": 592.055}, {"text": "is", "start": 592.537}, {"text": "next.", "start": 592.669}], "scenes": [{"start": 0, "w0": 0}, {"start": 40.414, "w0": 114}, {"start": 79.19500000000001, "w0": 212}, {"start": 107.68, "w0": 284}, {"start": 148.62699999999998, "w0": 402}, {"start": 184.84099999999998, "w0": 499}, {"start": 225.814, "w0": 607}, {"start": 259.71999999999997, "w0": 704}, {"start": 302.854, "w0": 828}, {"start": 344.519, "w0": 938}, {"start": 377.98199999999997, "w0": 1038}, {"start": 432.143, "w0": 1186}, {"start": 464.317, "w0": 1277}, {"start": 499.889, "w0": 1370}, {"start": 535.451, "w0": 1471}, {"start": 574.734, "w0": 1581}], "sentences": [{"start": 0.05, "end": 4.096, "text": "Three law firms, the same AI, and three very different outcomes."}, {"start": 4.546, "end": 11.105, "text": "At the first, a senior developer watched the mailroom, where a clerk spent five minutes renaming and filing each scanned letter."}, {"start": 11.555, "end": 15.099, "text": "Within a month, he had replaced that job with two API calls."}, {"start": 15.549, "end": 21.693, "text": "At the second firm, adoption was patchy, and power users sent seven-page AI instructions to IT."}, {"start": 22.143, "end": 29.622, "text": "At the third, juniors no longer wrote first drafts, so the firm paired each junior with a senior attorney to mark up the AI draft together."}, {"start": 30.072, "end": 32.002, "text": "Efficiency with a risk to jobs."}, {"start": 32.452, "end": 33.162, "text": "Little of either."}, {"start": 33.612, "end": 36.153, "text": "Or reorganised work with no jobs lost."}, {"start": 36.603, "end": 39.864, "text": "This video explains why that happens, and what it means for you."}, {"start": 40.714, "end": 47.614, "text": "The source is a report called Working with AI, published on the 23rd of November 2026 by Anthropic's economics team."}, {"start": 48.064, "end": 55.789, "text": "The researchers ran 66 video interviews with people at 58 American companies, all Anthropic customers in the middle of adopting AI."}, {"start": 56.239, "end": 61.725, "text": "They ranged from AI-native startups to hundred-year-old businesses, from dentists to hedge funds."}, {"start": 62.175, "end": 63.488, "text": "Keep two limits in mind."}, {"start": 63.938, "end": 67.461, "text": "The companies were picked for variety, not to represent the economy."}, {"start": 67.911, "end": 73.845, "text": "And the value ratings are what people said, classified by an automated coder, not measured by experiments."}, {"start": 74.295, "end": 78.645, "text": "So treat the numbers as patterns from conversations, not national statistics."}, {"start": 79.495, "end": 82.162, "text": "So what is AI actually doing in these firms?"}, {"start": 82.612, "end": 84.692, "text": "Mostly, agents are writing code."}, {"start": 85.142, "end": 88.887, "text": "People described 100 pieces of software in enough detail to sort them."}, {"start": 89.337, "end": 95.179, "text": "80 percent automated work that people had been doing by hand, like spreadsheet updates or meeting notes."}, {"start": 95.629, "end": 99.797, "text": "The other 20 percent replaced existing software, often bought from vendors."}, {"start": 100.247, "end": 102.124, "text": "And the builders are not only engineers."}, {"start": 102.574, "end": 107.13, "text": "Finance, operations and executives are building their own apps and dashboards."}, {"start": 107.98, "end": 110.852, "text": "The first big idea is about where the value comes from."}, {"start": 111.302, "end": 119.161, "text": "The team plotted nearly 300 AI use cases by how valuable people said they were, and by how much the organisation had to change to use them."}, {"start": 119.611, "end": 126.61, "text": "Light-touch uses that slot into the existing structure, like slide decks or one-off analysis, were mostly rated as low value."}, {"start": 127.06, "end": 136.735, "text": "The high-value uses, like coding agents combined with merged roles, or an agent that checks documents against company policy, needed processes or roles to change."}, {"start": 137.185, "end": 140.822, "text": "The link is moderate, not perfect, but the direction is clear."}, {"start": 141.272, "end": 144.525, "text": "Using AI to do the same job a little faster is worth little."}, {"start": 144.975, "end": 148.077, "text": "Changing how the work is organised is where the payoff is."}, {"start": 148.927, "end": 153.476, "text": "The second idea is that AI mostly makes firms do more, not spend less."}, {"start": 153.926, "end": 158.453, "text": "Where people said where the benefit landed, 55 percent of use cases added output."}, {"start": 158.903, "end": 166.64, "text": "That means faster work, more of it, new internal tools, new products, and above all better quality, the single biggest category."}, {"start": 167.09, "end": 172.494, "text": "Only 19 percent cut costs, and most of those were hiring that never happened rather than layoffs."}, {"start": 172.944, "end": 178.204, "text": "Another 19 percent produced no value yet, stuck in pilots, bottlenecks or review."}, {"start": 178.654, "end": 184.291, "text": "And about 7 percent of the value was kept by employees themselves, as nicer work or more downtime."}, {"start": 185.141, "end": 186.172, "text": "What about jobs?"}, {"start": 186.621, "end": 188.62, "text": "Layoffs driven by AI were rare."}, {"start": 189.07, "end": 193.771, "text": "At five companies, people described pushing out staff who refused to adopt AI."}, {"start": 194.221, "end": 197.122, "text": "Only two had seen automation eliminate a position outright."}, {"start": 197.572, "end": 201.655, "text": "Ten said AI made them hire more, mostly for AI and IT roles."}, {"start": 202.105, "end": 203.563, "text": "The bigger effect was quieter."}, {"start": 204.013, "end": 206.995, "text": "People at two-thirds of the companies said they were hiring less."}, {"start": 207.445, "end": 210.706, "text": "As one put it, we may not be firing, but we're not hiring."}, {"start": 211.156, "end": 212.742, "text": "Contractors were hit hardest."}, {"start": 213.192, "end": 219.535, "text": "Nine companies cut outsourced developers, customer service, legal or back-office work, much of it offshore."}, {"start": 219.985, "end": 225.264, "text": "And six AI-native startups said that, without AI, they would need four times as many staff."}, {"start": 226.114, "end": 228.479, "text": "Now to the three ways companies adopt AI."}, {"start": 228.929, "end": 230.726, "text": "The first is top-down automation."}, {"start": 231.176, "end": 234.355, "text": "Pick a workflow, build or buy an agent, and roll it out."}, {"start": 234.805, "end": 238.98, "text": "A document review agent cut planned reviewer hiring by more than 90 percent."}, {"start": 239.43, "end": 241.155, "text": "But this approach has costs."}, {"start": 241.605, "end": 245.993, "text": "It can feel like surveillance, with AI scoring staff on dozens of measures."}, {"start": 246.443, "end": 247.171, "text": "It is brittle."}, {"start": 247.621, "end": 250.674, "text": "One executive called it throwing darts at a spinning dart board."}, {"start": 251.124, "end": 254.211, "text": "And it needs experts to build the very systems that could replace them."}, {"start": 254.661, "end": 259.17, "text": "One engineer said, if I'm open to this, I'm essentially building my own coffin."}, {"start": 260.02, "end": 261.42, "text": "The second approach is bottom-up."}, {"start": 261.87, "end": 263.747, "text": "Hand out the tools and see what people do."}, {"start": 264.197, "end": 270.283, "text": "Here the winners are domain experts who are not programmers, which matches Anthropic's earlier research on Claude Code."}, {"start": 270.733, "end": 275.721, "text": "An accountant vibe-coded a 401k audit tool for a job that used to take 80 hours."}, {"start": 276.171, "end": 280.616, "text": "An investment manager built a deal tracker that replaced a 10,000 dollar a year product."}, {"start": 281.066, "end": 286.402, "text": "A paralegal called Mark wrote such good AI-assisted letters that the partners called him in to ask how he did it."}, {"start": 286.852, "end": 288.497, "text": "But bottom-up stays in pockets."}, {"start": 288.947, "end": 292.354, "text": "Home-made tools need maintenance, so the savings can be small."}, {"start": 292.804, "end": 294.807, "text": "And uneven adoption creates friction."}, {"start": 295.257, "end": 302.304, "text": "Power users lob what one firm called Claude grenades at their colleagues, who reply, I'm not reading your AI email."}, {"start": 303.154, "end": 306.64, "text": "This leads to the key concept in the report, which is bottlenecks."}, {"start": 307.09, "end": 310.918, "text": "When one task speeds up, the slowest step around it sets the pace."}, {"start": 311.368, "end": 317.254, "text": "The most common bottleneck, with 49 mentions, was simply too much AI output for people to check."}, {"start": 317.704, "end": 324.739, "text": "Next came staff resisting AI, with 43, and the need for expert review and testing, with 42."}, {"start": 325.189, "end": 330.321, "text": "Customers wary of AI came up only 13 times, and regulation just 4."}, {"start": 330.771, "end": 333.226, "text": "The blockers are mostly inside the organisation."}, {"start": 333.676, "end": 339.312, "text": "It echoes the arrival of electricity, when factory gains came only once the mill buildings were redesigned."}, {"start": 339.762, "end": 343.969, "text": "As one director said, the individual doesn't have the authority to change the work."}, {"start": 344.819, "end": 349.459, "text": "The third approach is to reorganise around AI, and it showed up as three moves."}, {"start": 349.909, "end": 354.516, "text": "The first is broadening roles, so that one person or a small team owns a whole workflow."}, {"start": 354.966, "end": 362.797, "text": "When producing the work gets fast, the slow part becomes agreeing what to do and handing it between people, and every handoff loses context."}, {"start": 363.247, "end": 370.348, "text": "So one firm merged lead sourcing, account executive and customer success into one role that owns the whole customer life cycle."}, {"start": 370.798, "end": 374.535, "text": "As one leader put it, two people plus Claude is the most amazing thing."}, {"start": 374.985, "end": 377.432, "text": "If two people agree on something, just ship it."}, {"start": 378.282, "end": 382.97, "text": "The second move is redeploying people toward the bottleneck tasks that AI cannot do yet."}, {"start": 383.42, "end": 390.276, "text": "Ellen, a software engineer who first feared she would be obsolete, said her job switched from writing code to making decisions."}, {"start": 390.726, "end": 398.977, "text": "At a construction firm, an agent now checks in with the crews and drafts the daily report, so project managers got their mornings back for customers."}, {"start": 399.427, "end": 406.527, "text": "A CTO said Claude is a terrible product manager, so his product managers now focus on taste, deciding what matters."}, {"start": 406.977, "end": 408.98, "text": "AI also creates new tasks."}, {"start": 409.43, "end": 420.442, "text": "Of the task changes the team catalogued, 68 were work that nobody did before, like accountants grading a finance agent, or marketers editing branding skill files instead of designing documents."}, {"start": 420.892, "end": 431.593, "text": "One engineer automated his alert tickets, then kept reviewing the agent's transcripts every two weeks, and grew it into a company-wide agent that, in his words, the company basically runs on."}, {"start": 432.443, "end": 435.55, "text": "The third move is common infrastructure, especially data."}, {"start": 436.0, "end": 442.846, "text": "A trucking company built a data warehouse that agents can query, and managers across the firm began running their own analyses."}, {"start": 443.296, "end": 448.321, "text": "Requests that once sat in the BI queue for a year or two, people now run for themselves."}, {"start": 448.771, "end": 452.591, "text": "At another company, the reporting team tried to block Claude from the data."}, {"start": 453.041, "end": 458.344, "text": "They lost, and their work shifted from building reports and dashboards to giving advice and insight."}, {"start": 458.794, "end": 463.767, "text": "Who gets access to data helps decide whether AI empowers staff or simply watches them."}, {"start": 464.617, "end": 471.221, "text": "The authors' conclusion is that the same technology is being used in very different ways, so employers have real choices."}, {"start": 471.671, "end": 474.178, "text": "Top-down risks automation and surveillance."}, {"start": 474.628, "end": 477.598, "text": "Bottom-up risks inequality between people and teams."}, {"start": 478.048, "end": 486.993, "text": "The firms that reorganised moved jobs toward what AI can't yet do, broadened roles, gave people authority over their own workflows, and shared data widely."}, {"start": 487.443, "end": 495.584, "text": "The authors recommend sharing the gains with staff, planning ahead for where redeployed people will go, and giving everyone access to data and tools."}, {"start": 496.034, "end": 499.339, "text": "And they are clear that none of this guarantees against job loss."}, {"start": 500.189, "end": 501.637, "text": "So what does this mean for you?"}, {"start": 502.087, "end": 504.913, "text": "Here is my reading of the evidence, as six lessons."}, {"start": 505.363, "end": 505.637, "text": "One."}, {"start": 506.087, "end": 507.988, "text": "Be the domain expert who builds."}, {"start": 508.438, "end": 514.234, "text": "Some of the biggest wins came from people who knew the work and used AI to make tools for it, not from programmers."}, {"start": 514.684, "end": 514.993, "text": "Two."}, {"start": 515.443, "end": 516.639, "text": "Move toward the bottleneck."}, {"start": 517.089, "end": 522.886, "text": "Checking output, judging quality, deciding what matters and working with people are where humans are scarce."}, {"start": 523.336, "end": 526.742, "text": "If AI makes your output cheap, make your judgment valuable."}, {"start": 527.192, "end": 527.557, "text": "Three."}, {"start": 528.007, "end": 529.133, "text": "Own the whole workflow."}, {"start": 529.583, "end": 534.901, "text": "The more of the chain you control, from the customer to delivery, the fewer handoffs slow you down."}, {"start": 535.751, "end": 536.093, "text": "Four."}, {"start": 536.543, "end": 539.384, "text": "Become the person who runs and maintains the agents."}, {"start": 539.834, "end": 546.13, "text": "Writing prompts, reviewing transcripts and fixing what breaks is new work, and it does not stop once the agent is built."}, {"start": 546.58, "end": 546.968, "text": "Five."}, {"start": 547.418, "end": 548.44, "text": "Share your methods."}, {"start": 548.89, "end": 554.072, "text": "Mark called his workflow his secret sauce, but sharing it made him his firm's lead for AI enablement."}, {"start": 554.522, "end": 555.039, "text": "Six."}, {"start": 555.489, "end": 556.996, "text": "Respect other people's attention."}, {"start": 557.446, "end": 562.054, "text": "Check AI output before you send it, because unchecked volume is the number one bottleneck."}, {"start": 562.505, "end": 567.443, "text": "As one executive put it, a mediocre engineer with an AI is a menace to society."}, {"start": 567.893, "end": 574.184, "text": "And if your own work is reports and dashboards, expect it to move toward advice and insight, and get there first."}, {"start": 575.034, "end": 576.041, "text": "One last point."}, {"start": 576.491, "end": 581.912, "text": "Models improve every few months, so do not lock yourself into a plan built for today's capabilities."}, {"start": 582.362, "end": 588.447, "text": "As one HR manager said, you wait three months, something new is possible, and you revise your whole plan."}, {"start": 588.897, "end": 592.932, "text": "The people who do well will be the ones who keep moving to wherever the bottleneck is next."}], "duration": 593.33};
